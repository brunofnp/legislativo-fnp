services:
  legislativo:
    build: .
    image: legislativo-fnp:latest
    command: sh entrypoint.sh
    env_file: .env
    ports:
      - "127.0.0.1:8004:8004"  # nunca porta pública direta — só o Nginx expõe
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles  # Nginx serve /static/ direto do host (deploy/nginx-legislativo.conf) — sem isso o collectstatic fica preso dentro do container
    restart: unless-stopped
    healthcheck:
      # -H "Host: ..." é obrigatório -- sem isso o curl manda "Host:
      # localhost:8004", que o Django rejeita (DisallowedHost, só
      # legislativo.fnp.org.br está em ALLOWED_HOSTS) e o healthcheck falhava
      # sempre, mesmo com o site respondendo 200 de verdade via Nginx (achado
      # via Sentry, 2026-08-11).
      test: ["CMD", "curl", "-f", "-H", "Host: legislativo.fnp.org.br", "http://localhost:8004/"]
      interval: 30s
      timeout: 5s
      retries: 3

  sync-camara:
    image: legislativo-fnp:latest  # mesma imagem do serviço legislativo (build faz cache, não builda 2x)
    # Desativado de propósito (profiles: nunca sobe com "docker compose up -d"
    # padrão) -- mesmo com --paginas 1, seguia recriando proposição sem
    # curadoria da FNP a cada ciclo de 30min, misturando com as 104 reais do
    # legado (voltou a 165 numa única sessão). Banco travado só nas 104 até
    # decisão futura sobre um fluxo de atualização em tempo real com
    # curadoria (ver CLAUDE.md, decisão em 2026-08-11). Pra reativar:
    # "docker compose --profile sync-camara up -d sync-camara".
    profiles: ["sync-camara"]
    # --paginas 1 (era o default 2) -- cada keyword é uma busca de texto livre
    # na API da Câmara (casa contra a proposição inteira, não só o título),
    # então gera muita proposição nova sem curadoria a cada ciclo de 30min;
    # 1 página (100 resultados) por keyword corta o volume pela metade sem
    # mudar quais termos são buscados. Ver CLAUDE.md, decisão em 2026-08-07.
    command: python manage.py sync_camara --keywords "municípios,municipal,prefeituras,FPM" --paginas 1 --watch 1800
    env_file: .env
    restart: unless-stopped
    depends_on:
      - legislativo
