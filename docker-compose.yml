services:
  legislativo:
    build: .
    image: legislativo-fnp:latest
    command: sh entrypoint.sh
    env_file: .env
    ports:
      - "127.0.0.1:8004:8004"  # nunca porta pública direta — só o Nginx expõe
    volumes:
      - ./media:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/"]
      interval: 30s
      timeout: 5s
      retries: 3

  sync-camara:
    image: legislativo-fnp:latest  # mesma imagem do serviço legislativo (build faz cache, não builda 2x)
    command: python manage.py sync_camara --keywords "municípios,municipal,prefeituras,FPM" --watch 1800
    env_file: .env
    restart: unless-stopped
    depends_on:
      - legislativo
