name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Sem isso, DEBUG cai no default fail-closed (False) e o settings.py
      # exige SECRET_KEY (correção de segurança de 2026-08-06) -- CI roda
      # como dev local, não como produção, então usa a chave efêmera.
      DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run migrations
        run: python manage.py migrate
      - name: Run tests
        run: pytest
      - name: Scan dependencies for known vulnerabilities
        run: pip-audit -r requirements.lock
