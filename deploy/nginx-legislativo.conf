# Bloco Nginx isolado para o Painel Legislativo FNP, para adicionar ao
# Nginx compartilhado do droplet fnp-web (que já serve outros sistemas da
# FNP) SEM tocar nos blocos existentes (ver docs/runbook.md § Deploy).
#
# Instalação (no droplet, via SSH):
#   sudo cp deploy/nginx-legislativo.conf /etc/nginx/sites-available/legislativo.conf
#   sudo ln -s /etc/nginx/sites-available/legislativo.conf /etc/nginx/sites-enabled/
#   sudo nginx -t                     # validar sintaxe ANTES de recarregar —
#                                      # um erro aqui derruba os outros sistemas também
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d legislativo.fnp.org.br
#
# Pré-requisito: DNS de legislativo.fnp.org.br (registro A) apontando para o
# IP público do fnp-web (142.93.205.222). Gerenciado no painel da própria
# DigitalOcean (Networking > Domains > fnp.org.br) — os nameservers do
# domínio são ns1/ns2/ns3.digitalocean.com, NÃO Cloudflare (documentação
# anterior estava errada nisso; confirmado via `dig NS fnp.org.br` em
# 2026-08-05). Cuidado: havia um CNAME "legislativo" antigo apontando para
# ghs.googlehosted.com, resíduo do app legado no Firebase Hosting
# (legislativo-fnp.web.app) — precisa ser removido/substituído pelo A record
# acima, senão o desafio HTTP do certbot não alcança este droplet.
#
# Ajuste os caminhos de alias abaixo se o clone não estiver em /opt/legislativo-fnp
# (ver deploy/sync-camara.service, que já usa esse mesmo caminho como padrão).

server {
    listen 80;
    server_name legislativo.fnp.org.br;

    location /static/ {
        alias /opt/legislativo-fnp/staticfiles/;
    }

    location /media/ {
        alias /opt/legislativo-fnp/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

