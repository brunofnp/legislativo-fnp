[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legislativo-fnp"
version = "0.1.0"
description = "Painel Legislativo FNP — Django rewrite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Django>=4.2,<5.0",
  "dj-database-url>=1.0,<2.0",
  "python-dotenv>=1.0",
  "psycopg2-binary>=2.9",
  "whitenoise>=6.5",
  "gunicorn>=20.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.5",
  "black>=24.0",
  "ruff>=0.0.294",
  "isort>=5.0",
  "django-debug-toolbar>=4.0"
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "C", "B", "I"]
