[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legislativo-fnp"
version = "0.1.0"
description = "Painel Legislativo FNP — Django rewrite"
readme = "README.md"
requires-python = ">=3.11"
# Dependências NÃO ficam aqui: fonte da verdade é requirements.txt /
# requirements-dev.txt, com versões travadas em requirements.lock (Docker e CI
# instalam só desses). Este arquivo vale apenas pela config de black/isort/ruff.

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C", "B", "I"]
